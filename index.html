<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mekong Healthy F&B Cần Thơ | Chiến Lược & 3 Mô Hình Thực Chiến</title>
    <meta name="description" content="Phân tích chuyên sâu nghịch lý thức ăn nhanh công sở Cần Thơ, tâm lý hành vi & 3 concept kinh doanh: Mekong Bowl, Wrap & Run, Bếp Lành Đô Thị." />
    <meta property="og:title" content="Mekong Healthy F&B Cần Thơ | Chiến Lược & 3 Mô Hình Thực Chiến" />
    <meta property="og:description" content="Phân tích chuyên sâu nghịch lý thức ăn nhanh công sở Cần Thơ, tâm lý hành vi & 3 concept kinh doanh: Mekong Bowl, Wrap & Run, Bếp Lành Đô Thị." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
      // Single Page Application redirect handling for GitHub Pages
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          var segments = p.split('/').filter(Boolean);
          // If on repository root without trailing slash (e.g., /HealthyFastFood), add trailing slash
          if (segments.length === 1 && !p.endsWith('/')) {
            window.location.replace('/' + segments[0] + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root">
      <div id="app-loading-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1c1917;color:#f5f5f4;font-family:system-ui,-apple-system,sans-serif;">
        <div style="text-align:center;padding:24px;max-width:480px;">
          <div style="width:42px;height:42px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;"></div>
          <div style="font-size:16px;font-weight:700;color:#f5f5f4;letter-spacing:0.5px;">Mekong Healthy F&B</div>
          <div style="font-size:13px;color:#a8a29e;margin-top:6px;">Đang tải ứng dụng & dữ liệu mô hình...</div>
          <div id="loading-fallback" style="display:none;margin-top:20px;padding:14px;background:#292524;border-radius:10px;font-size:12px;color:#fde047;text-align:left;line-height:1.6;border:1px solid #44403c;">
            💡 <strong>Nếu màn hình không tải sau vài giây:</strong><br/>
            • Hãy thử tải lại trang (F5 hoặc Ctrl+Shift+R).<br/>
            • Nếu bạn đang triển khai trên GitHub Pages, hãy đảm bảo chọn <strong>Source: GitHub Actions</strong> trong phần <em>Settings → Pages</em>.
          </div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <script>
        setTimeout(function() {
          var fallback = document.getElementById('loading-fallback');
          if (fallback && !document.getElementById('app-loaded-flag')) {
            fallback.style.display = 'block';
          }
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
